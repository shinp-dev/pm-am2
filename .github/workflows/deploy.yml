name: Deploy PM A2 to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pm-a2-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-sources.mjs
      - name: Check deployment settings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STUDY_PASSWORD: ${{ secrets.STUDY_PASSWORD }}
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          [ -n "$STUDY_PASSWORD" ] || { echo 'Missing STUDY_PASSWORD'; exit 1; }
      - name: Prepare D1 and apply migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXISTING_D1_DATABASE: ${{ vars.PM_A2_D1_DATABASE }}
        run: |
          database_name="${EXISTING_D1_DATABASE:-pm-a2-study}"
          database_id() {
            npx wrangler d1 list --json | jq -r --arg name "$database_name" '.[] | select(.name == $name) | .uuid'
          }
          id="$(database_id)"
          if [ -z "$id" ] && [ -n "$EXISTING_D1_DATABASE" ]; then
            echo "Configured D1 database was not found in the target account."
            exit 1
          fi
          if [ -z "$id" ]; then
            npx wrangler d1 create "$database_name" --location apac --update-config=false
            id="$(database_id)"
          fi
          [[ "$id" =~ ^[a-f0-9-]{36}$ ]]
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$id/" wrangler.jsonc
          npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker and verify login and D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STUDY_PASSWORD: ${{ secrets.STUDY_PASSWORD }}
        run: |
          secret_file="$(mktemp)"
          deploy_log="$(mktemp)"
          cookie_file="$(mktemp)"
          trap 'rm -f "$secret_file" "$deploy_log" "$cookie_file"' EXIT
          node -e 'process.stdout.write(JSON.stringify({STUDY_PASSWORD: process.env.STUDY_PASSWORD}))' > "$secret_file"
          npx wrangler deploy --secrets-file "$secret_file" | tee "$deploy_log"
          url="$(sed -nE 's/^[[:space:]]*(https:\/\/pm-a2-study\.[a-z0-9-]+\.workers\.dev)\/?[[:space:]]*$/\1/p' "$deploy_log" | head -1)"
          [ -n "$url" ]
          curl --retry 5 --retry-all-errors --retry-delay 3 --silent --fail "$url/login" >/dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/study")" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/data.js")" = 302 ]
          [ "$(printf '%s' "$STUDY_PASSWORD" | curl -s -o /dev/null -w '%{http_code}' -c "$cookie_file" -H "Origin: $url" --data-urlencode 'password@-' "$url/login")" = 303 ]
          curl -fsS -b "$cookie_file" "$url/api/study" | jq -e '(.attempts | type == "array") and (.preferences | type == "object")'
          curl -fsS -b "$cookie_file" -H "Origin: $url" -H 'Content-Type: application/json' -d '{"attempts":[],"preferences":[]}' "$url/api/study" | jq -e .saved
          printf '演習室 URL: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
